<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garage color acceptance</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #f4f5f7; color: #0f172a; font-family: Inter, system-ui, sans-serif; }
      main { max-width: 1120px; margin: 0 auto; padding: 56px 32px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 28px; color: #64748b; }
      .acceptance-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
      .acceptance-card { overflow: hidden; border-radius: 20px; }
      .acceptance-card .customer-garage-card-banner { display: flex; height: 132px; align-items: center; justify-content: center; overflow: hidden; }
      .acceptance-marker { position: relative; z-index: 3; width: 122px; height: 38px; border: 2px solid rgba(255,255,255,.82); border-radius: 24px 34px 12px 12px; box-shadow: 0 12px 26px -12px rgba(15,23,42,.46), inset 0 1px 0 rgba(255,255,255,.45); }
      .acceptance-marker::before, .acceptance-marker::after { content: ""; position: absolute; bottom: -9px; width: 18px; height: 18px; border: 4px solid rgba(255,255,255,.9); border-radius: 50%; background: rgba(30,41,59,.74); }
      .acceptance-marker::before { left: 16px; }
      .acceptance-marker::after { right: 16px; }
      .acceptance-label { padding: 13px 16px 15px; font-size: 13px; font-weight: 700; letter-spacing: .02em; background: rgba(255,255,255,.94); }
      @media (max-width: 760px) { .acceptance-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <main>
      <h1>Saved vehicle color comparison</h1>
      <p>Production Garage header layers rendered side-by-side.</p>
      <section class="acceptance-grid">
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#4a86da;--vehicle-accent-strong:#285faf;--vehicle-accent-glow:rgba(37,99,180,.46);--vehicle-accent-border:#356FBD;--vehicle-card-tint:#E7F0FC;--vehicle-header-base-from:#f7f9fc;--vehicle-header-base-to:#e8edf3;--vehicle-header-from-strength:38%;--vehicle-header-to-strength:40%;--vehicle-glow-layer-opacity:.9;--vehicle-badge-tint-strength:18%;--vehicle-decoration-opacity:.14"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Blue</div></div></article>
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#4e9a68;--vehicle-accent-strong:#2f754a;--vehicle-accent-glow:rgba(47,132,72,.44);--vehicle-accent-border:#3E8557;--vehicle-card-tint:#E8F4EB;--vehicle-header-base-from:#f7f9fc;--vehicle-header-base-to:#e8edf3;--vehicle-header-from-strength:38%;--vehicle-header-to-strength:40%;--vehicle-glow-layer-opacity:.9;--vehicle-badge-tint-strength:18%;--vehicle-decoration-opacity:.14"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Green</div></div></article>
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#cf5961;--vehicle-accent-strong:#a63c47;--vehicle-accent-glow:rgba(190,58,71,.44);--vehicle-accent-border:#B64751;--vehicle-card-tint:#FBE9EA;--vehicle-header-base-from:#f7f9fc;--vehicle-header-base-to:#e8edf3;--vehicle-header-from-strength:38%;--vehicle-header-to-strength:40%;--vehicle-glow-layer-opacity:.9;--vehicle-badge-tint-strength:18%;--vehicle-decoration-opacity:.14"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Red</div></div></article>
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#d8ae36;--vehicle-accent-strong:#a87918;--vehicle-accent-glow:rgba(211,165,43,.46);--vehicle-accent-border:#B88A20;--vehicle-card-tint:#FBF3D8;--vehicle-header-base-from:#f7f9fc;--vehicle-header-base-to:#e8edf3;--vehicle-header-from-strength:38%;--vehicle-header-to-strength:40%;--vehicle-glow-layer-opacity:.9;--vehicle-badge-tint-strength:18%;--vehicle-decoration-opacity:.14"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Yellow</div></div></article>
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#d97b32;--vehicle-accent-strong:#aa4f20;--vehicle-accent-glow:rgba(211,101,42,.46);--vehicle-accent-border:#BB612A;--vehicle-card-tint:#FBEADD;--vehicle-header-base-from:#f7f9fc;--vehicle-header-base-to:#e8edf3;--vehicle-header-from-strength:38%;--vehicle-header-to-strength:40%;--vehicle-glow-layer-opacity:.9;--vehicle-badge-tint-strength:18%;--vehicle-decoration-opacity:.14"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Orange</div></div></article>
        <article class="customer-garage-card acceptance-card" style="--vehicle-accent:#a9b1bd;--vehicle-accent-strong:#64748b;--vehicle-accent-glow:rgba(100,116,139,.16);--vehicle-accent-border:#64748B;--vehicle-card-tint:#FFFEFA;--vehicle-header-base-from:#faf8f4;--vehicle-header-base-to:#eeeae4;--vehicle-header-from-strength:25%;--vehicle-header-to-strength:28%;--vehicle-glow-layer-opacity:.66;--vehicle-badge-tint-strength:0%;--vehicle-decoration-opacity:.08"><div class="customer-garage-card-frame"><div class="customer-garage-card-banner"><div class="customer-garage-vehicle-visual"><div class="acceptance-marker"></div></div></div><div class="acceptance-label">Neutral</div></div></article>
      </section>
    </main>
  </body>
</html>
